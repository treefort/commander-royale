# Commander Royale behind nginx (TLS from certbot or similar). The game listens on 127.0.0.1:3000 and does its own
# sign-in (e.g. AUTH=none PLUGINS=plugins/google.ts,plugins/passkey.ts), so nginx only terminates TLS and passes
# WebSockets through. Every request, game data included, goes to the game, which checks the session.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.example.com;
    ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    # OAuth codes travel in query strings: keep them out of the logs
    access_log off;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # turns can be long: keep idle WebSockets open
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
